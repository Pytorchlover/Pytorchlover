name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Pytorchlover
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=dark&color_dots=#BF5AF2,#64D2FF,#FF9F0A,#30D158,#FF375F,#0A84FF
            dist/github-contribution-grid-snake.svg?color_snake=light

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
